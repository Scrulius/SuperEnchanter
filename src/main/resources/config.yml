# =============================================================
# SuperEnchanter - Plugin Configuration
# Author: Scrulius (GitHub)
# =============================================================
# Custom Anvil & Enchanting Table GUIs inspired by Hypixel SkyBlock
# All text uses MiniMessage format: https://docs.advntr.dev/minimessage/
# =============================================================
# Marcador de versión interno — no editar. Al actualizar el plugin, las claves
# nuevas se fusionan automáticamente sin pisar tus valores.
config-version: 11

# ─────────────────────────────────────────────
# SALVAVIDAS DE ARRANQUE
# ─────────────────────────────────────────────
# Si el plugin no puede arrancar (falta EcoEnchants, error de inicialización, …),
# APAGA el servidor entero en vez de dejarlo correr sin SuperEnchanter. Para servers
# donde correr sin el plugin es peor que no correr. Pon 'false' para que en ese caso
# solo se desactive el plugin y el server siga arrancando.
fail-safe:
  shutdown-on-critical-error: true

# ─────────────────────────────────────────────
# CUSTOM ANVIL SETTINGS
# ─────────────────────────────────────────────
anvil:
  # Moneda por defecto del yunque: XP, VAULT o PLAYER_POINTS.
  default-cost-type: XP

  # Parámetros de la curva de coste (por operación, según niveles añadidos).
  base-xp-cost: 1
  cost-per-enchant-level: 3
  max-xp-cost: 39

  # Chain-forging: el resultado se queda en el slot de objeto para encadenar mejoras.
  chain-forging: true

  # ── Sello Purificador: quita maldiciones en el yunque ──
  # Mete el objeto maldito a la izquierda y un Sello Purificador (item MythicMobs) a la
  # derecha: si el objeto tiene ≥1 maldición, "Forjar" se las quita TODAS y consume el
  # sello. GRATIS (el coste es el propio sello, que fabricas/vendes más caro que el
  # antimaldiciones — prevenir < curar). Si el objeto no tiene maldiciones, no hace nada.
  curse-removal:
    enabled: true
    seal-ids:
      - sello_purificador

  # ── Overrides de coste por ítem (sacrificio) ──
  # Cobra distinto según el sacrificio. Se evalúan en orden; gana la primera que
  # haga match. Tipos de match (campo 'type'):
  #   MATERIAL          → 'value' = material (p.ej. ENCHANTED_BOOK)
  #   CUSTOM_MODEL_DATA → 'value' = el CMD (número) que debe llevar el ítem
  #   NAMESPACE         → 'namespace' y/o 'key' contra la key del material del ítem
  #   PDC_KEY           → 'namespace'+'key' = clave del PersistentDataContainer.
  #                       Si das 'value', compara ese String (p.ej. el "type" de
  #                       MythicMobs); si lo omites, basta con que la clave exista.
  # Monedas (campo 'cost-type'): XP, VAULT, PLAYER_POINTS.
  cost-overrides:
    # Ejemplo: cobrar tokens de PlayerPoints por una runa custom de MythicMobs
    # - match:
    #     type: PDC_KEY
    #     namespace: "mythicmobs"
    #     key: "type"
    #     value: "ANCIENT_RUNE"
    #   cost-type: PLAYER_POINTS
    #   amount: 50
    #
    # Ejemplo: cobrar dinero (Vault) por un material concreto
    # - match:
    #     type: MATERIAL
    #     value: "ENCHANTED_BOOK"
    #   cost-type: VAULT
    #   amount: 5000.0

# ─────────────────────────────────────────────
# CUSTOM ENCHANTING TABLE SETTINGS
# ─────────────────────────────────────────────
enchanting:
  # Bookshelf scanning radius
  scan-radius-horizontal: 2
  scan-radius-vertical: 2
  air-gap-required: true

  # Tope máximo de poder de estantería. El tramo alto SOLO lo dan las librerías
  # encantadas (ver vanilla-power-cap), así que los encantamientos top exigen una
  # mesa bien construida con librerías.
  max-bookshelf-power: 330

  # Tope a lo que aportan las estanterías VANILLA (no marcadas). Por mucho que
  # llenes la sala de bookshelves normales, no pasarás de aquí: del soft-cap al
  # max-bookshelf-power solo se sube colocando librerías encantadas.
  vanilla-power-cap: 30

  # (Las partículas ambientales de las librerías se configuran en la sección
  #  'particles' al final del archivo.)

  # Power values per block type (estanterías vanilla / bloques sin marcar)
  power-values:
    BOOKSHELF: 1
    # Custom blocks can be added by namespace:
    # "mythicmobs:magical_bookshelf": 15

  # ── Librerías Encantadas (items de MythicMobs) ──
  # Item de MythicMobs (Placeable: true) que se coloca como CHISELED_BOOKSHELF.
  # El plugin la sella (llena de libros, no se pueden sacar) y le da más poder que
  # una estantería normal. La clave es el id del item de MM; el valor es el poder
  # que aporta. Se marca al colocarla, se devuelve al picarla y es indestructible
  # por TNT/fuego/pistones/endermen.
  #   Para llegar al max (330): 30 vanilla (tope) + 30 librerías × 10 = 330.
  enchanted-bookshelves:
    libreria_encantada: 10

  # Moneda con la que cobra la mesa de encantamientos: XP, VAULT o PLAYER_POINTS.
  # El importe calculado por la curva de abajo se cobra en esta moneda (igual que
  # el yunque con anvil.default-cost-type). Si pones VAULT/PLAYER_POINTS sin el
  # plugin correspondiente, nunca se podrá pagar.
  cost-type: XP

  # ── Moneda POR RAREZA (override del cost-type global) ──
  # Cobra ciertas rarezas en una moneda distinta a la global de arriba. Las
  # rarezas que NO aparezcan aquí usan 'cost-type'. Pensado para que Divino se
  # compre solo con la moneda PREMIUM del servidor (PlayerPoints), mientras el
  # resto sigue en XP. Monedas: XP, VAULT, PLAYER_POINTS. Usa los ids de rareza
  # de tu EcoEnchants (comun/raro/epico/legendario/divino).
  rarity-cost-type:
    divino: PLAYER_POINTS

  # ── Curva de coste ──
  # Coste POR PASO de un nivel:
  #   paso(nivel) = min( max-xp-cost, multiplicadorRareza * (base + mult * nivel^exponente) )
  #   - cost-exponent 1.0 = lineal; >1 hace los niveles altos más caros.
  #   - max-xp-cost capa CADA paso (no la suma) para que un solo nivel no se dispare.
  # El coste que pagas al saltar a un nivel destino es la SUMA de los pasos desde tu
  # nivel actual hasta el destino (ir directo a V cuesta lo mismo que forjar
  # I→II→III→IV→V a mano). Así la curva es un sumidero real y no un peaje del último
  # nivel. OJO: con esto los niveles altos de rarezas caras acumulan mucho; si te
  # parece excesivo, baja base/level-xp-multiplier/max-xp-cost.
  # Rebalanceado: el coste se cobra en NIVELES de XP y con tirada POR PASO (cada nivel
  # es un peldaño con su tirada; conservas lo conseguido). Valores bajos a propósito.
  base-xp-cost: 3
  level-xp-multiplier: 3
  cost-exponent: 1.0
  max-xp-cost: 18

  # Encantamientos por página en la lista de la mesa (se capa al nº de slots).
  enchantments-per-page: 10

  # ── Encantamiento PROBABILÍSTICO ──
  # Activado por defecto (es la experiencia base de DarkMines). Ponlo en false solo
  # si quieres volver temporalmente al 100% garantizado.
  # Cada intento de encantar tiene una PROBABILIDAD de éxito
  # según la rareza del encantamiento. Un FALLO consume TODO igual (coste + reactivo)
  # — ese es el riesgo y el sumidero. Aparece un slot de POTENCIADOR en la mesa
  # (a la izquierda, bajo el ítem) donde puedes meter un item de MythicMobs que
  # SUMA % de éxito. Un potenciador de +100% (o más) es un "orbe de garantía".
  #   probabilidad efectiva = clamp( base(rareza) + %potenciador , 0..100 )
  success-chance:
    enabled: true
    # Probabilidad base (0-100) para rarezas sin entrada propia.
    default: 100
    # Si true, el potenciador SOLO se gasta cuando el encantamiento entra (en vez de
    # consumirse en cada intento). Por defecto se gasta siempre (más punitivo/gacha).
    boosters-consumed-on-success-only: false
    # Probabilidad base por rareza de EcoEnchants. La rareza alta es un gamble real:
    # legendario/divino entran pocas veces sin un sello de garantía (success-chance.
    # boosters) o sin nivel de Magia que suba el %. ⚠️ Divino es premium (PlayerPoints):
    # con 10% un fallo quema moneda real, así que para divino la jugada segura es el
    # Sello Divino (garantía); el 10% es para quien arriesga. (El Reembolso Arcano de
    # Magia devuelve parte del coste al fallar — mitiga el sumidero.)
    by-rarity:
      comun: 80
      raro: 65
      epico: 35
      legendario: 20
      divino: 10
    # Items POTENCIADORES de MythicMobs ("sellos"): se meten en el slot de potenciador
    # de la mesa y SUMAN % de éxito. Cada sello se ATA a una rareza: solo aporta (y
    # solo se consume) cuando el encantamiento es de ESA rareza; con otra rareza no
    # hace nada y no se gasta. Un sello con percent 100 sobre su rareza la GARANTIZA
    # (un "Sello Raro" hace que un encantamiento raro entre al 100%).
    # Formato por entrada (id = id del item de MythicMobs):
    #   id: { rarity: <rareza>, percent: <0-100> }   # percent por defecto 100
    #   rarity puede ser '*' / any / all (u omitirse) → sello UNIVERSAL (cualquier rareza).
    #   También admite forma corta 'id: 25' = universal +25%.
    # (Ejemplos listos para testear en items/superenchanter_sellos.yml.)
    # Da los items con '/se give <id>' o con los comandos de MythicMobs.
    boosters:
      sello_comun:       { rarity: comun,      percent: 100 }
      sello_raro:        { rarity: raro,       percent: 100 }
      sello_epico:       { rarity: epico,      percent: 100 }
      sello_legendario:  { rarity: legendario, percent: 100 }
      sello_divino:      { rarity: divino,     percent: 100 }
      # Universal opcional (sube cualquier rareza un poco, no garantiza):
      # sello_universal:  { rarity: '*', percent: 25 }

  # ── Probabilidad de maldición al encantar ──
  # Al encantar con ÉXITO hay una probabilidad BAJA de que el ítem reciba además una
  # MALDICIÓN aleatoria (del catálogo type: curse que targetee el ítem). Es riesgo/sabor
  # y NO se puede prevenir (es un gamble inevitable) — la única salida es CURARLA en el
  # yunque con el Sello Purificador (ver anvil.curse-removal).
  curse-chance:
    enabled: true
    # % de maldecir POR NIVEL GANADO al encantar con éxito (admite decimales). OJO: la
    # tirada es por peldaño, así que subir un ítem a V (5 niveles) expone ~5×: con 0.4
    # un ítem completo a V queda en ~2% de maldición (no 0.4%). Sube/baja con eso en mente.
    base-percent: 0.4
    # Override por rareza (los que no aparezcan usan base-percent). Divino es premium
    # (se paga con moneda real) → 0 para no castigar la compra premium.
    by-rarity:
      divino: 0.0
    # Maldiciones que la tirada NUNCA aplica (por key/path). Ambas vanilla quedan vetadas:
    # 'vanishing_curse' no encaja con el keepinventory (no pierdes ítems al morir) y
    # 'binding_curse' rompería el juego (no podrías quitarte la armadura NUNCA — ni morir
    # la suelta ni podrías meterla en el yunque para purificarla → pegada para siempre).
    excluded:
      - vanishing_curse
      - binding_curse

  # ── Skill de MAGIA (vía SuperCore -> EcoSkills) ──
  # Encantar en la mesa da XP de una skill de EcoSkills ("Magia"); su nivel mejora el
  # propio encantar (más éxito, menos coste) y, por las recompensas de la skill (wisdom),
  # más maná. Requiere SuperCore + EcoSkills; si faltan, Magia se desactiva sola.
  magia:
    enabled: true
    # Id de la skill de EcoSkills (nombre del .yml en EcoSkills/skills/). Reutilizamos la
    # 'enchanting' nativa (ya tematizada como "Magia"); su XP la damos NOSOTROS por API
    # (la mesa custom no dispara el encantar vanilla del que viviría esa skill).
    skill-id: enchanting
    # XP de Magia por NIVEL de encantamiento ganado, ponderada por rareza. Los que no
    # aparezcan usan 'default'.
    xp-per-rarity:
      comun: 2
      raro: 5
      epico: 12
      legendario: 25
      divino: 50
      default: 5
    # Fracción de la XP que se gana aun FALLANDO un peldaño ("aprendes del error").
    xp-fail-fraction: 0.25
    # Carril 1 — probabilidad de éxito: +per-level % por nivel de Magia, tope max-bonus %.
    success:
      per-level: 0.5
      max-bonus: 25
    # Carril 2 — descuento de coste: -per-level % por nivel, tope max-percent %. Se combina
    # (multiplicativo) con el descuento por permiso. Se ve YA en el coste del icono.
    discount:
      per-level: 0.4
      max-percent: 20
    # Sub-habilidad "Reembolso Arcano": prob. (por nivel de Magia) de RECUPERAR el coste
    # de un peldaño cuando FALLA la tirada de éxito. Contrarresta el sumidero del
    # success-chance: +per-level % por nivel, tope max-percent %. A nivel 50 → 30%.
    refund:
      per-level: 0.6
      max-percent: 30
    # Carril 5 — gating: HARD-GATE por nivel de Magia. legendario y divino NO se pueden
    # encantar sin nivel suficiente (salgan las odds que salgan). Común/raro/épico NO se
    # gatean: su "puerta" es el % de éxito (success-chance.by-rarity), no un candado, para
    # no atascar al jugador en rarezas bajas. El icono muestra el candado + nivel requerido
    # antes de clicar (no falla al hacer clic). Si Magia se desactiva (sin SuperCore), el
    # gate cae solo (no bloquea a nadie). Pon enabled:false para quitar todos los candados.
    gating:
      enabled: true
      required-level:
        legendario: 20
        divino: 35
    # (El bonus de XP de Magia que muestra la cabeza de estadísticas de la mesa se lee
    #  NATIVO de EcoSkills — boosters por permiso × efecto skill_xp_multiplier — así que
    #  refleja CUALQUIER fuente automáticamente; no hay lista que mantener aquí.)

  # ── Iconos de categoría ──
  # Material del icono de cada categoría (tipo de EcoEnchants) en el primer nivel
  # del menú. Las categorías = los 'type' de types.yml (las 5 rarezas + curse +
  # spell). 'default' se usa para las que no tengan entrada propia.
  category-icons:
    default: ENCHANTED_BOOK
    comun: BOOK
    raro: LAPIS_LAZULI
    epico: AMETHYST_SHARD
    legendario: GOLD_INGOT
    divino: NETHER_STAR
    curse: WITHER_SKELETON_SKULL
    spell: ENCHANTED_BOOK

  # ── Overrides por encantamiento ──
  # Ajustes finos por id (key completa "namespace:path" o solo "path"). Todos los
  # campos son opcionales; lo que no pongas se calcula normal.
  #   max-level       → capa el nivel máximo ofrecido
  #   xp-cost         → coste fijo por nivel (ignora la curva y el multiplicador)
  #   required-power  → poder de estantería fijo por nivel
  #   cost-multiplier → multiplica el coste de la curva (si no hay xp-cost)
  enchantment-overrides: {}
  #  "ecoenchants:telekinesis":
  #    max-level: 1
  #    cost-multiplier: 2.0
  #  sharpness:
  #    required-power: 50

  # Blacklist de encantamientos que NO aparecerán en la mesa.
  # Cada entrada puede ser:
  #   - una key completa:  "minecraft:mending", "ecoenchants:telekinesis"
  #   - solo la ruta:      "mending"  (el namespace es opcional)
  #   - el token "#curses" para desactivar TODAS las maldiciones (vanilla + tipo curse de EcoEnchants)
  #   - el token "#type:<id>" para desactivar una categoría entera de EcoEnchants
  # No distingue mayúsculas/minúsculas.
  disabled-enchantments:
    - "minecraft:mending"
    - "#curses"

  # ── Multiplicador de coste por rareza (EcoEnchants) ──
  # Multiplica la curva de coste de arriba según la rareza. Usa los IDs de
  # rareza de tu EcoEnchants. (El max-xp-cost evita que se disparen.)
  default-rarity-multiplier: 1.0
  rarity-cost-multipliers:
    comun: 1.0
    raro: 1.7
    epico: 2.5
    legendario: 4.0
    # Divino se cobra en moneda premium (rarity-cost-type), así que este
    # multiplicador solo aplica si lo dejas en XP/Vault. Aun así lo dejamos alto.
    divino: 6.0

  # ── Poder de estantería requerido por rareza ──
  # poder(nivel) = min( max-bookshelf-power, floor + nivel * step )
  # El 'floor' hace que una rareza exija un mínimo de poder YA en el nivel I,
  # así el poder controla la MAGNITUD (rareza), no solo la fracción de nivel.
  # Calibrado para max-bookshelf-power 330 y vanilla-power-cap 30:
  #   - common: por debajo de 30 → mesa de solo estanterías vanilla.
  #   - uncommon: justo por encima → pide alguna librería.
  #   - rare/epic/legendary: exigen un muro de librerías (legendary roza 330).
  default-rarity-power:
    floor: 0
    step: 5
  rarity-power:
    comun:      { floor: 0,   step: 4 }
    raro:       { floor: 35,  step: 12 }
    epico:      { floor: 90,  step: 20 }
    legendario: { floor: 170, step: 30 }
    divino:     { floor: 260, step: 35 }

  # ── Reactivo material por rareza ──
  # Ítem (y cantidad) que se consume al encantar, según la rareza.
  # 'custom-model-data' es opcional: si se indica, el ítem debe llevar ese CMD.
  # 'default-reagent' se usa para rarezas sin entrada propia (omítelo para ninguno).
  # Si 'reagent-scales-with-level' es true, la cantidad se multiplica por el nivel
  # (nivel V cuesta 5x el reactivo de nivel I).
  # OJO: con tirada POR PASO el reactivo se consume EN CADA peldaño (cada nivel es un
  # intento). Por eso 'reagent-scales-with-level' va en FALSE (si no, se multiplicaría
  # dos veces) y los importes son bajos. Se quitaron netherite_scrap/nether_star: a x5
  # peldaños eran una locura. Divino se gatea por PlayerPoints + poder, no por reactivo caro.
  reagent-scales-with-level: false
  default-reagent:
    material: LAPIS_LAZULI
    amount: 1
  rarity-reagents:
    raro:
      material: LAPIS_LAZULI
      amount: 2
    epico:
      material: AMETHYST_SHARD
      amount: 2
    legendario:
      material: AMETHYST_SHARD
      amount: 3
    divino:
      material: AMETHYST_SHARD
      amount: 2

# ─────────────────────────────────────────────
# TRANSFERENCIA DE ENCANTAMIENTOS (grindstone)
# ─────────────────────────────────────────────
# Repurposa el grindstone (desactivado de serie en RPG): pones un item DONANTE
# (se consume ENTERO) y un item DESTINO, y mueves los encantamientos ELEGIDOS (multi-
# selección) del donante al destino en UNA operación. El destino debe poder llevarlos
# — mismas reglas que la mesa (targets/conflictos/requeridos/type-limit/blacklist).
# Mover NO duplica poder: el donante (con lo no elegido) se destruye.
transfer:
  enabled: true

  # Extraer a libro: si pones un LIBRO normal en el slot de destino, sacas los
  # encantamientos elegidos a un libro encantado (se consume 1 libro + el donante).
  # El libro encantado es comerciable / aplicable luego con el yunque.
  allow-extract: true

  # Multiplicador de coste de la EXTRACCIÓN respecto a transferir (crea un libro
  # vendible, por eso cuesta más). 1.0 = igual que transferir.
  extract-cost-multiplier: 2.0

  # Moneda del coste: XP, VAULT o PLAYER_POINTS.
  cost-type: XP

  # Coste POR encantamiento = min( max-cost, multRareza * (base-cost + level-multiplier * nivel^exp) )
  # donde 'nivel' es el nivel resultante. Con multi-selección se PAGA la suma de los elegidos.
  # Más BARATO que crear en la mesa a propósito: mover/extraer es recuperar algo ya creado
  # (y destruyes el donante), no debe costar más que encantar de cero.
  base-cost: 2
  level-multiplier: 3
  cost-exponent: 1.0
  max-cost: 20

  # Si true, multiplica el coste por enchanting.rarity-cost-multipliers según la
  # rareza del encantamiento (transferir un legendario cuesta más).
  use-rarity-multiplier: true

  # Si true, donante y destino deben ser EXACTAMENTE el mismo material. Si false
  # (por defecto), basta con que el encantamiento sea válido para el destino
  # (p.ej. mover Filo de una espada de hierro a una de diamante).
  require-same-material: false

# ─────────────────────────────────────────────
# DESCUENTOS DE COSTE POR PERMISO
# ─────────────────────────────────────────────
# Rebaja (o anula) el coste de CUALQUIER operación —yunque, mesa y transferencia—
# según los permisos del jugador. Se aplica tanto al precio MOSTRADO como al COBRADO.
#   superenchanter.cost.bypass        → gratis total (coste 0).
#   superenchanter.cost.discount.<n>  → -n% de descuento (n = 1..100). Si el jugador
#                                        tiene varios, se usa el MAYOR. Ej: ".25" = -25%.
# Útil para rangos/VIPs. Pon 'enabled: false' para ignorar los permisos por completo.
cost-discounts:
  enabled: true

# ─────────────────────────────────────────────
# ANTI-DUPE & SECURITY
# ─────────────────────────────────────────────
anti-dupe:
  # Cooldown in ticks between transactions (20 ticks = 1 second)
  transaction-cooldown-ticks: 5

  # Persist items in GUI slots to prevent loss on server crash
  crash-persistence-enabled: true

# ─────────────────────────────────────────────
# LOG DE AUDITORÍA
# ─────────────────────────────────────────────
# Registra TODAS las operaciones (forjar / encantar / transferir / extraer) en
# 'audit.log' dentro de la carpeta del plugin: fecha, jugador, acción, ítem y coste.
# Es un rastro para que el staff investigue anomalías económicas o abusos; NO
# previene ni detecta dupes por sí solo, da contexto forense.
audit-log:
  enabled: true
  # Además del archivo, vuelca cada línea a la consola del server.
  to-console: false

# ─────────────────────────────────────────────
# CONTROL DE LOOT
# ─────────────────────────────────────────────
# Evita que los jugadores consigan encantamientos "gratis" (coste 0) en el loot
# natural: cofres de estructuras (End, mansiones, trial chambers...), pesca, etc.
# La obtención de encantamientos debe pasar SIEMPRE por la mesa custom.
loot-control:
  enabled: true
  # Quita los libros encantados del loot generado (se eliminan del cofre/drop).
  remove-enchanted-books: true
  # Quita los encantamientos de CUALQUIER ítem del loot (herramientas, armas Y
  # armaduras: pico, espada, arco, tridente, coraza, caña...), dejando el ítem LIMPIO
  # (no lo elimina). Quita tanto vanilla como EcoEnchants. NO afecta a los libros
  # (esos los controla 'remove-enchanted-books').
  strip-equipment-enchantments: true
  # Aplica también a los drops de mobs (equipo encantado que sueltan al morir).
  include-mob-drops: true
  # Mundos donde NO aplicar el control (lista de nombres). Vacío = aplicar en todos.
  disabled-worlds: []

# ─────────────────────────────────────────────
# BANNED ENCHANTMENTS (purga global — sucesor del plugin AntiMending)
# ─────────────────────────────────────────────
# Encantamientos PROHIBIDOS en todo el servidor: se eliminan de CUALQUIER ítem
# (inventarios, ítems recogidos, pesca) y se bloquea su efecto. Por diseño el
# server RPG desactiva 'mending' (la reparación por XP rompería la economía de
# encantar). La mesa custom nunca lo ofrece (blacklist) y el yunque vanilla está
# bloqueado; esto cierra los huecos restantes (ítems previos, libros, creativo).
banned-enchantments:
  enabled: true
  # Keys a purgar. 'mending' = minecraft:mending; admite keys completas (namespace:key),
  # también de EcoEnchants. Quita el encantamiento del ítem dejándolo limpio.
  keys:
    - mending
  # Purga el inventario del jugador al entrar / abrir un inventario / clickear
  # (el strip del click se difiere 1 tick para no romper el tracking de Bukkit ni dupear).
  purge-player-inventories: true
  # Bloquea PlayerItemMendEvent: la XP NUNCA repara durabilidad (el efecto de mending),
  # aunque algún ítem se colara con el encantamiento.
  block-xp-repair: true

# ─────────────────────────────────────────────
# VILLAGER TRADES
# ─────────────────────────────────────────────
villager-trades:
  enabled: true
  # Los aldeanos no adquieren NINGÚN trade cuyo resultado sea un libro (libro, libro
  # encantado, libro escribible/escrito, libro de conocimiento). Evita comprar
  # encantamientos "gratis" a los bibliotecarios saltándose la mesa custom.
  block-book-trades: true

# ─────────────────────────────────────────────
# SOUNDS
# ─────────────────────────────────────────────
# Cada sonido admite dos formas:
#   - clave suelta (volume/pitch = 1.0):   error: entity.villager.no
#   - objeto con volumen y tono:           error: { key: entity.villager.no, volume: 1.0, pitch: 1.0 }
# Usa claves namespaced (minúsculas, con puntos), NO nombres de enum.
sounds:
  anvil-success:    { key: block.anvil.use,                volume: 1.0, pitch: 1.0 }
  enchant-success:  { key: block.enchantment_table.use,    volume: 1.0, pitch: 1.2 }
  # Fallo del encantamiento probabilístico (success-chance).
  enchant-fail:     { key: block.fire.extinguish,          volume: 1.0, pitch: 0.8 }
  # Transferir y extraer ya NO suenan igual que encantar (antes compartían sonido).
  transfer-success: { key: block.amethyst_block.chime,     volume: 1.0, pitch: 0.8 }
  extract-success:  { key: block.amethyst_block.chime,     volume: 1.0, pitch: 1.4 }
  error:            { key: entity.villager.no,             volume: 1.0, pitch: 1.0 }
  # Abrir/cerrar menú con algo más sutil que un cofre.
  gui-open:         { key: block.barrel.open,              volume: 0.8, pitch: 1.1 }
  gui-close:        { key: block.barrel.close,             volume: 0.8, pitch: 1.1 }
  # Clicks de navegación dentro de los menús.
  button-click:     { key: ui.button.click,               volume: 0.7, pitch: 1.2 }

# ─────────────────────────────────────────────
# PARTICLES
# ─────────────────────────────────────────────
# type = nombre de enum de Bukkit (ENCHANT, WITCH, PORTAL, FLAME, ...).
# offset = dispersión en cada eje · speed = velocidad/data · count = cantidad.
particles:
  # Estallido al encantar con éxito (sobre la mesa).
  enchant-success:
    enabled: true
    type: ENCHANT
    count: 50
    offset: { x: 0.5, y: 0.5, z: 0.5 }
    speed: 0.2
  # Humo al fallar un encantamiento probabilístico (sobre la mesa).
  enchant-fail:
    enabled: true
    type: LARGE_SMOKE
    count: 25
    offset: { x: 0.4, y: 0.5, z: 0.4 }
    speed: 0.02
  # Aura ambiental sobre las librerías encantadas cercanas a jugadores.
  # period-ticks = cada cuántos ticks se refresca (20 = 1s). Coste mínimo.
  library-ambient:
    enabled: true
    type: ENCHANT
    count: 4
    offset: { x: 0.25, y: 0.2, z: 0.25 }
    speed: 0.02
    period-ticks: 25

# ─────────────────────────────────────────────
# MESSAGES
# ─────────────────────────────────────────────
# All user-facing messages have been moved to messages.yml
# for easier customisation. Edit that file to change any text.

